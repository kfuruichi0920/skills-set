<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img"><title>type-30-1: 重なりのベン図</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#555"/></marker></defs><rect width="840" height="460" fill="white"/><g font-family="sans-serif" fill="#222"><text x="24" y="35" font-size="22" text-anchor="start">重なりのベン図</text><text x="24" y="64" font-size="14" text-anchor="start">構成の骨格：領域・対応・関係を示す</text><circle cx="280" cy="230" r="100" fill="white" fill-opacity="0.7" stroke="#555"/><text x="280" y="235" font-size="14" text-anchor="middle">集合 A</text><circle cx="410" cy="210" r="80" fill="white" fill-opacity="0.7" stroke="#555"/><text x="410" y="215" font-size="14" text-anchor="middle">集合 B</text><circle cx="350" cy="305" r="65" fill="white" fill-opacity="0.7" stroke="#555"/><text x="350" y="310" font-size="14" text-anchor="middle">集合 C</text><rect x="590" y="155" width="190" height="160" fill="white" stroke="#555" stroke-dasharray="none"/><text x="685.0" y="240.0" font-size="14" text-anchor="middle">重複と補足</text><text x="24" y="425" font-size="13" text-anchor="start">模式図：形・大きさ・色は実データや完成デザインを表さない</text></g></svg>
