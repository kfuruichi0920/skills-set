      "license_scope": "Pinned repository LICENSE; individual retained assets separately recorded.",
      "summary": "抽象度ごとに複数ページを分離し、対象境界と外部依存を示す; クラスの名前・属性・操作を区画で分離し関連で結ぶ; 部品の提供・要求インターフェースを接続する; 実行環境の境界に配備物を配置する; 開始・判断・分岐・終了を区別する; パッケージ包含と依存線を区別する; 利用者とシステム境界内の機能を関連づける; 参加者の横配置とメッセージの縦順序を分離する; 状態ノードとイベント・条件付き遷移を結ぶ; 外部主体・処理・保存先・データ名を区別する; 行を持つ実体テーブルを多重度付き関係で結ぶ; 要求・画面・データの異種要素を関連で束ねる; 要求IDと要求内容を分け、導出・充足関係を識別する; ブロック構成と型の関係を階層的に表す; Ring、Star、Fully connected、Common Busを同じページで並べ、接続密度を比較する; LANの領域・機器・接続を分離する; 共通バスと機器への接続点を表す; AWS Cloud→VPC→Availability Zone→Public/Private領域をネストし、主系・副系DBを並列配置する; サービスと領域を階層化し、通信経路を結ぶ; センサーから収集・処理・保存の流れを段階化する; 開発リポジトリ、Jenkins Namespace、ステージングと本番Namespaceを分離し、番号付きの配備順を示す; オンプレミスとCloudを分離し、アプリ・DB複製と待機スナップショットを関連づける。Multi-regionそのものの証明ではない; ラックの物理位置を縦方向のスロットで表す; データ経路と信頼境界を重ねて脅威の位置を示す; 処理矩形と判断菱形の区別で分岐を示す; 処理順序に担当レーンを重ねる; 工程と担当の交差で引継ぎを可視化する; イベント・タスク・ゲートウェイの専用記法を使う; Public/Registered User/組織内担当者と製品・購読・ライセンスを関連づけ、役割ごとのアクセスを示す; 親子の責任系統を上から下へ分岐する; 複数の事業観点を区画化したキャンバスに配置する; ユーザー行動の横順序と優先度の縦構造を分ける; 時間軸上に節目と説明を配置する; 縦タイムライン、蛇行する連続工程、番号付き横帯、旗付き工程を同ページで比較する; タスク行と日程列に期間バーを重ねる; 作業の前後関係と分岐・合流をネットワークで示す; 複数の依存先を有向グラフとして配置する; 状態列と作業カードで滞留を示す; 横の工程軸に参加チームの短い縦線とラベルを配置する。期間幅や担当人数の量は符号化しない; 成果物や仕事を階層分解する; コインと骰子の条件付き分岐と経路確率を対応づける。リスクの重大度評価表ではない; 独立する二軸を四象限に交差させる; 内外と正負の観点を四区画に整理する; 六つの外部環境要因を独立領域として配置する; 市場の五観点を比較できるまとまりへ配置する; 結果へ向かう主軸に原因分類を枝として付加する; 望ましくない事象を論理条件へ分解する; 左右の比較対象から共通属性へ合流し、下段で個別の差異へ分ける。Before/After専用図ではない; 判断と選択枝を階層化する; 概念同士を関係ラベル付きで接続する; 集合領域の重なりで共通部分を示す; 第1ページは蒸気系統を細線の束と斜線の装置領域で表現する。数値比例幅の精度をこのプレビューだけで確認しない; 円柱・階段・ピラミッド・同心円・層状半円など同じ層構造の複数表現を横に並べる; 繰返し形状の配置で工程の順番を示す; 二つの人物図形それぞれへ吹き出しの説明を対応づける; Storage・Integrations・Platforms・Third-partyの区画にIcon+Labelをタイル状に並べる。Hub-and-spokeではない; 画面全体のスクリーンショットではなく、選択ハンドルやメニュー断片に外周の矢印説明を付加したUIチュートリアル; 重ねる説明要素をレイヤー単位で管理する; 中央のFood Chain Cycleを六つの周辺六角形で囲み、隣接する要素間の周回を示す; 並行する枝と合流を時間順序で示す",
